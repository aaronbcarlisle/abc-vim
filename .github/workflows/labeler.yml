name: labeler

# pull_request_target lets Dependabot and fork PRs get labels too. It's safe
# here: labeler reads .github/labeler.yml and the changed-file list through the
# API and never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  # A manual run applies only the changed-files rules: labeler reads the branch
  # name from the pull_request event, which a manual run doesn't have. To get
  # the head-branch labels on an older PR, close and reopen it, or push to it.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to label (changed-files rules only)
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v7
        with:
          # empty on PR events, so labeler uses the PR that triggered the run
          pr-number: ${{ inputs.pr }}
